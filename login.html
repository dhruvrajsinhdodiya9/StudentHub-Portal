<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub | Login</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">
        <div class="auth-card">
            <img src="charusat-logo.jpg" alt="CHARUSAT Logo" class="auth-logo-img">
            <h1 class="auth-logo">StudentHub</h1>
            <p class="auth-subtitle">Welcome Back! Sign in to continue</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="loginIdentifier">Gmail Address or Username</label>
                    <input type="text" id="loginIdentifier" placeholder="name@gmail.com or username" required>
                </div>

                <div class="form-group">
                    <label for="loginPassword">Password</label>
                    <input type="password" id="loginPassword" placeholder="••••••••" required>
                </div>

                <button type="submit" class="btn" style="width: 100%; margin-top: 10px;">
                    Sign In
                </button>
            </form>

            <div style="text-align: right; margin-top: 14px;">
                <a href="#" id="forgotPasswordLink" style="color: var(--text-secondary); text-decoration: none; font-size: 13px;">Forgot Password?</a>
            </div>

            <p class="auth-footer-text">
                Don't have an account? <a href="signup.html">Sign Up</a>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
