<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub | Sign Up</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="auth-container">
        <div class="auth-card">
            <img src="charusat-logo.jpg" alt="CHARUSAT Logo" class="auth-logo-img">
            <h1 class="auth-logo">Create Account</h1>
            <p class="auth-subtitle">Join StudentHub to manage your studies</p>

            <form id="signupForm">
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <input type="text" id="signupName" placeholder="Dhruvrajsinh Dodiya" required>
                </div>

                <div class="form-group">
                    <label for="signupUsername">Username</label>
                    <input type="text" id="signupUsername" placeholder="dhruvrajsinh" required>
                </div>

                <div class="form-group">
                    <label for="signupEmail">Gmail Address</label>
                    <input type="email" id="signupEmail" placeholder="dhruvrajsinh@gmail.com" required>
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <input type="password" id="signupPassword" placeholder="••••••••" required>
                    <div class="password-strength-container">
                        <div class="strength-bar-bg">
                            <div id="strengthBar" class="strength-bar-fill"></div>
                        </div>
                        <div id="strengthText" class="strength-text">Password requirements: Min 8 chars, uppercase, lowercase & numbers</div>
                    </div>
                </div>

                <button type="submit" id="btnSignupSubmit" class="btn" style="width: 100%; margin-top: 14px;">
                    Create Account
                </button>
            </form>

            <p class="auth-footer-text">
                Already have an account? <a href="login.html">Sign In</a>
            </p>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
