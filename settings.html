<!DOCTYPE html>
<html lang="en">
<head>
    <!-- Basic page information -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Settings - StudentHub Portal</title>
</head>

<body>
<header>
    <!-- Website header -->
    <table width="100%">
        <tr>
            <td><img src="charusat-logo.jpg" alt="CHARUSAT Logo" width="100"></td>
            <td><h1>StudentHub Portal</h1><p>Account Settings</p></td>
            <td align="right"><a href="dashboard.html">Dashboard</a> | <a href="index.html">Logout</a></td>
        </tr>
    </table>
    <hr>
    <nav>
        <a href="dashboard.html">Dashboard</a> | <a href="profile.html">Profile</a> |
        <a href="settings.html">Settings</a> | <a href="contact.html">Contact</a>
    </nav>
    <hr>
</header>

<main>
    <!-- Account settings form -->
    <section>
        <h2>Update Account Settings</h2>

        <form action="dashboard.html" method="get">
            <fieldset>
                <legend>Settings</legend>

                <p><label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" value="student@example.com"></p>

                <p><label for="password">New Password:</label><br>
                <input type="password" id="password" name="password"></p>

                <p>
                    <input type="checkbox" id="notifications" name="notifications">
                    <label for="notifications">Receive portal notifications</label>
                </p>

                <p>
                    <input type="checkbox" id="updates" name="updates">
                    <label for="updates">Receive academic updates</label>
                </p>

                <p>
                    <button type="submit">Save Settings</button>
                    <button type="reset">Reset</button>
                </p>
            </fieldset>
        </form>
    </section>

    <hr>

    <!-- Account information -->
    <section>
        <h2>Account Information</h2>
        <p><strong>Account Type:</strong> Student</p>
        <p><strong>Student ID:</strong> 25CS009</p>
        <p><strong>Portal:</strong> StudentHub - CHARUSAT</p>
    </section>
</main>

<hr>

<footer>
    <p>StudentHub Portal - CHARUSAT</p>
    <p><a href="dashboard.html">Back to Dashboard</a></p>
</footer>
</body>
</html>
