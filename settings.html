<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StudentHub | Settings</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="main-content">
        <!-- Page Header -->
        <div class="page-header">
            <div>
                <h1>Portal Settings</h1>
                <p>Manage your account configurations, alerts, and theme preferences</p>
            </div>
        </div>

        <form style="display: flex; flex-direction: column; gap: 24px;">
            <div class="grid-3">
                <!-- Account Settings -->
                <div class="card">
                    <h2>👤 Account Details</h2>
                    <div style="margin: 16px 0;">
                        <p style="font-size: 14px; margin-bottom: 8px;"><strong>Full Name:</strong> Dhruvrajsinh Dodiya
                        </p>
                        <p style="font-size: 14px; margin-bottom: 16px;"><strong>Email:</strong> dhruv@example.com</p>
                    </div>
                    <button type="button" class="btn btn-secondary edit-profile-btn" style="width: 100%;">Edit Profile
                        Info</button>
                </div>

                <!-- Notifications Preferences -->
                <div class="card" style="display: flex; flex-direction: column; gap: 12px;">
                    <h2>Alert Options</h2>
                    <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer;">
                        <input type="checkbox" checked style="width: auto;"> Email Notifications
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer;">
                        <input type="checkbox" checked style="width: auto;"> Exam Reminders
                    </label>
                    <label style="display: flex; align-items: center; gap: 10px; font-size: 14px; cursor: pointer;">
                        <input type="checkbox" style="width: auto;"> SMS Mobile Alerts
                    </label>
                </div>

                <!-- Theme Settings -->
                <div class="card">
                    <h2>Theme Selection</h2>
                    <div class="form-group" style="margin-top: 12px;">
                        <label for="theme-select">Current Mode</label>
                        <select id="theme-select">
                            <option value="dark">Dark Theme (Default)</option>
                            <option value="light">Light Theme</option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- Password Modification Card -->
            <div class="card">
                <h2>Update Portal Password</h2>
                <div class="grid-3" style="margin-bottom: 0; margin-top: 16px;">
                    <div class="form-group">
                        <label for="curr-pwd">Current Password</label>
                        <input type="password" id="curr-pwd" placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label for="new-pwd">New Password</label>
                        <input type="password" id="new-pwd" placeholder="••••••••">
                    </div>
                    <div class="form-group">
                        <label for="confirm-pwd">Confirm New Password</label>
                        <input type="password" id="confirm-pwd" placeholder="••••••••">
                    </div>
                </div>
                <div style="text-align: right; margin-top: 12px;">
                    <button type="button" class="btn btn-secondary update-password-btn">Update Password</button>
                </div>
            </div>

            <!-- Submit Controls -->
            <div style="text-align: center; margin-top: 8px;">
                <button type="submit" class="btn" style="padding: 14px 48px; font-size: 15px;">Save Settings
                    Preference</button>
            </div>
        </form>
    </main>

    <script src="script.js"></script>
</body>

</html>
